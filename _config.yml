# Site identity. The visible header stays the name. The document title adds
# the tagline so a tab, a preview, and an agent can tell this is a
# product-design portfolio without a second line in the sidebar.
title: Ярослав Коротких
tagline: Портфолио продуктового дизайнера
description: >-
  Увеличиваю ценность продукта через исследования. Создаю масштабируемые
  дизайн-системы. Выстраиваю процессы DesignOps.
lang: ru-RU
url: https://yourawsluv.github.io

author:
  name: Ярослав Коротких
  job_title: продуктовый дизайнер
  email: yaroslawkorotkih@yandex.ru

# Public profiles already linked from the sidebar. Used in Person JSON-LD.
social:
  links:
    - https://t.me/yourawsluv
    - https://linkedin.com/in/yaroslavkorotkikh
    - https://github.com/yourawsluv
    - https://x.com/yourawsluv

# Default social preview image for pages that don't set their own.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/logo.png

logo: /assets/img/logo.png
favicon: /assets/img/favicon.png
remote_theme: pages-themes/minimal@v0.2.0
plugins:
- jekyll-remote-theme

# Keep tooling, docs and templates out of the built site.
exclude:
- AGENTS.md
- README.md
- _templates/
- Gemfile
- Gemfile.lock
- vendor/
- .bundle/
- .cursor/
- test/
